name: Docker Hub Publish

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/mgn-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./src/front
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/mgn-frontend:latest
          build-args: |
            PUBLIC_AUTH0_DOMAIN_MGN=${{ secrets.PUBLIC_AUTH0_DOMAIN_MGN }}
            PUBLIC_AUTH0_CLIENT_ID_MGN=${{ secrets.PUBLIC_AUTH0_CLIENT_ID_MGN }}