name: Docker Hub Publish

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/mgn-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./src/front
          file: ./src/front/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/mgn-frontend:latest
          # AÑADIMOS ESTO PARA QUE EL FRONT SEPA DÓNDE ESTÁ EL BACK
          build-args: |
            PUBLIC_API_URL=http://localhost:3000
            PUBLIC_AUTH0_DOMAIN_MGN=${{ secrets.AUTH0_DOMAIN }}
            PUBLIC_AUTH0_CLIENT_ID_MGN=${{ secrets.AUTH0_CLIENT_ID }}