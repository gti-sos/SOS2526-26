services:
  back:
    build:
      context: .             # <--- Mira en la raíz del proyecto
      dockerfile: src/back/Dockerfile  # <--- Pero usa el Dockerfile que está aquí dentro
    ports:
      - "3000:3000"
    networks:
      - mgn-network

  front:
    build:
      context: ./src/front
      # Aquí le pasamos los argumentos al Dockerfile
      args:
        - PUBLIC_AUTH0_DOMAIN_MGN=${PUBLIC_AUTH0_DOMAIN_MGN}
        - PUBLIC_AUTH0_CLIENT_ID_MGN=${PUBLIC_AUTH0_CLIENT_ID_MGN}
    ports:
      - "8080:80"
    depends_on:
      - back
    networks:
      - mgn-network

networks:
  mgn-network:
    driver: bridge